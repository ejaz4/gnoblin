name: Private RPM runtime bootstrap

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rpm-compat-bootstrap.yml"
      - "packaging/rpm/compat-bootstrap.json"
      - "packaging/rpm/patches/gobject-introspection-python312.patch"
      - "packaging/rpm/provision-compat-container.sh"
      - "packaging/rpm/build-compat-bootstrap.sh"
      - "scripts/build-private-deps.py"
  pull_request:
    paths:
      - ".github/workflows/rpm-compat-bootstrap.yml"
      - "packaging/rpm/compat-bootstrap.json"
      - "packaging/rpm/patches/gobject-introspection-python312.patch"
      - "packaging/rpm/provision-compat-container.sh"
      - "packaging/rpm/build-compat-bootstrap.sh"
      - "scripts/build-private-deps.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: ${{ matrix.target }} private GLib/GI bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: rocky-8
            image: quay.io/rockylinux/rockylinux:8
          - target: rocky-9
            image: quay.io/rockylinux/rockylinux:9
          - target: rocky-10
            image: quay.io/rockylinux/rockylinux:10
          - target: opensuse-leap-15.5
            image: registry.opensuse.org/opensuse/leap:15.5
          - target: opensuse-leap-16.0
            image: registry.opensuse.org/opensuse/leap:16.0
    container: ${{ matrix.image }}
    steps:
      - name: Install checkout tools
        run: |
          source /etc/os-release
          case "$ID" in
            opensuse-leap)
              for attempt in 1 2 3; do
                if zypper --non-interactive --gpg-auto-import-keys refresh --force; then
                  break
                fi
                if [ "$attempt" -eq 3 ]; then
                  exit 1
                fi
                sleep "$((attempt * 15))"
              done
              zypper --non-interactive install --no-recommends git tar
              ;;
            *)
              dnf -qy install git tar
              ;;
          esac
      - uses: actions/checkout@v4
      - name: Provision build image
        run: packaging/rpm/provision-compat-container.sh
      - name: Build private bootstrap as an unprivileged user
        run: |
          chown -R gnoblin-build:gnoblin-build "$GITHUB_WORKSPACE"
          runuser -u gnoblin-build -- packaging/rpm/build-compat-bootstrap.sh
