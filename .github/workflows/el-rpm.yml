name: Enterprise Linux RPM adapter

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/el-rpm.yml"
      - "packaging/el/**"
      - "packaging/rpm/build-compat-runtime.sh"
      - "packaging/rpm/compose-compat-runtime-manifest.py"
      - "packaging/rpm/provision-compat-container.sh"
      - "scripts/build-private-deps.py"
      - "scripts/make-tarball.sh"
      - "scripts/stage-rpm-sources.sh"
  pull_request:
    paths:
      - ".github/workflows/el-rpm.yml"
      - "packaging/el/**"
      - "packaging/rpm/build-compat-runtime.sh"
      - "packaging/rpm/compose-compat-runtime-manifest.py"
      - "packaging/rpm/provision-compat-container.sh"
      - "scripts/build-private-deps.py"
      - "scripts/make-tarball.sh"
      - "scripts/stage-rpm-sources.sh"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to build
        type: string
        default: main
        required: true
  workflow_call:
    inputs:
      ref:
        description: Branch, tag, or commit to build
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: EL ${{ matrix.version }} private RPM chain
    runs-on: ubuntu-latest
    container: quay.io/rockylinux/rockylinux:${{ matrix.version }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        version: ["8", "9", "10"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: false
      - name: Trust the checked-out source tree in the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Fetch pinned GNOME sources with retry
        run: |
          git submodule sync --recursive
          ./scripts/checkout-submodules-with-retry.sh
      - name: Build the private RPM chain
        env:
          GIT_COMMITTER_NAME: Gnoblin Package Builder
          GIT_COMMITTER_EMAIL: package-builder@gnoblin.local
          GNOBLIN_BUILD_JOBS: "2"
        run: bash packaging/el/build-chain.sh "$RUNNER_TEMP/rpmbuild"
      - name: Check package isolation
        run: |
          mapfile -t rpms < <(
            find "$RUNNER_TEMP/rpmbuild/RPMS" -type f \( \
              -name 'gnoblin-compat-runtime-[0-9]*.rpm' -o \
              -name 'gnoblin-gsettings-desktop-schemas-[0-9]*.rpm' -o \
              -name 'gnoblin-mutter-[0-9]*.rpm' -o \
              -name 'gnoblin-mutter-devel-[0-9]*.rpm' -o \
              -name 'gnoblin-shell-[0-9]*.rpm' -o \
              -name 'gnoblin-session-[0-9]*.rpm' \
            \) | LC_ALL=C sort
          )
          python3 scripts/check-rpm-isolation.py "${rpms[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: el-${{ matrix.version }}-rpms
          path: ${{ runner.temp }}/rpmbuild/RPMS/**/*.rpm
          if-no-files-found: error
          retention-days: 30

  coinstall:
    name: EL ${{ matrix.version }} GNOME coexistence and removal
    needs: build
    runs-on: ubuntu-latest
    container: quay.io/rockylinux/rockylinux:${{ matrix.version }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        version: ["8", "9", "10"]
    steps:
      - name: Install verification tools
        run: dnf -y install dnf-plugins-core python3 rpm
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: el-${{ matrix.version }}-rpms
          path: rpms
      - name: Install stock GNOME before Gnoblin
        run: |
          dnf -y install gdm gnome-session gnome-shell mutter
          rpm -q gnome-session gnome-shell mutter
          rpm -V gnome-session gnome-shell mutter
      - name: Install the private Gnoblin chain beside GNOME
        run: |
          mapfile -t component_rpms < <(
            find rpms -type f \( \
              -name 'gnoblin-compat-runtime-[0-9]*.rpm' -o \
              -name 'gnoblin-gsettings-desktop-schemas-[0-9]*.rpm' -o \
              -name 'gnoblin-mutter-[0-9]*.rpm' -o \
              -name 'gnoblin-mutter-devel-[0-9]*.rpm' -o \
              -name 'gnoblin-shell-[0-9]*.rpm' -o \
              -name 'gnoblin-session-[0-9]*.rpm' \
            \) | LC_ALL=C sort
          )
          mapfile -t all_rpms < <(find rpms -type f -name '*.rpm' | LC_ALL=C sort)
          python3 scripts/check-rpm-isolation.py "${component_rpms[@]}"
          dnf -y --nogpgcheck install "${all_rpms[@]}"
          rpm -q gnoblin gnoblin-compat-runtime gnoblin-gsettings-desktop-schemas gnoblin-mutter gnoblin-shell gnoblin-session
          test -f /usr/share/wayland-sessions/gnoblin.desktop
          test -f /usr/lib/systemd/user/org.gnoblin.Shell.target
          rpm -V gnome-session gnome-shell mutter
      - name: Remove Gnoblin and reverify stock GNOME
        run: |
          dnf -y remove gnoblin gnoblin-session gnoblin-shell gnoblin-mutter gnoblin-gsettings-desktop-schemas gnoblin-compat-runtime
          ! test -e /usr/share/wayland-sessions/gnoblin.desktop
          ! test -e /usr/lib/systemd/user/org.gnoblin.Shell.target
          rpm -q gnome-session gnome-shell mutter
          rpm -V gnome-session gnome-shell mutter
